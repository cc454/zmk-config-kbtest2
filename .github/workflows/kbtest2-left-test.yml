name: KBTest2 left-half test

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/kbtest2-left-test.yml
      - app/boards/shields/kbtest2_left_test/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: west init -l app
      - run: west update --fetch-opt=--filter=tree:0
      - run: west zephyr-export
      - run: west build -s app -b nice_nano//zmk -- -DSHIELD=kbtest2_left_test
      - uses: actions/upload-artifact@v4
        with:
          name: kbtest2-left-test
          path: build/zephyr/zmk.uf2
          if-no-files-found: error
