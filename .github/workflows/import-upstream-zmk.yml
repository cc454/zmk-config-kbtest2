name: Import current upstream ZMK
on:
  push:
    branches: [master]
    paths: [.github/workflows/import-upstream-zmk.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Replace repository files with verified upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          expected_head="$(git rev-parse HEAD)"
          git remote add upstream https://github.com/zmkfirmware/zmk.git
          git fetch --depth=1 upstream main
          source_commit="$(git rev-parse refs/remotes/upstream/main)"
          test "$source_commit" = "4de313367288aad5aeaa1243890e40dc813f7008"
          git read-tree --reset -u "$source_commit"
          test "$(git write-tree)" = "1b964fb2ef8e69979e2ee6b78f607788a1410d85"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: replace old files with latest upstream ZMK" -m "Source: zmkfirmware/zmk@$source_commit. Exact upstream tree; prior repository history retained."
          git diff --exit-code "$source_commit" HEAD
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$expected_head"
          git push origin HEAD:refs/heads/master
